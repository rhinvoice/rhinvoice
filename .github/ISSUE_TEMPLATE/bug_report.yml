name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. **Never paste real customer, invoice or bank data** – make up
        names and use example IBANs. Security issues go through a
        [private report](https://github.com/rhinvoice/rhinvoice/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in About Rhinvoice; with Docker, the image tag (`RHINVOICE_VERSION` in `.env`).
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: country
    attributes:
      label: Country of the company
      options: ["Switzerland", "Liechtenstein", "Germany", "Austria", "Does not matter"]
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How Rhinvoice runs
      options: ["Program for Windows or Mac", "Docker image (deploy/compose.yml)", "Built from source", "Public demo", "Other"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Error messages, screenshots, and the log if there is one (Windows and Mac – About Rhinvoice, Report a problem; Docker – `docker compose logs app`).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, device or system
      placeholder: "Firefox 140 on macOS, Safari on iPhone"
