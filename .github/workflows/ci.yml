name: CI

# A pull request gets the quick run (ADR 0029): mutation testing only for the domain and
# application modules it changes. The tag of a release candidate gets the full run, every
# mutant; the Release workflow publishes the candidate only after it passed, and its results on
# the released commit are the checks main asks for. The browser tests always run completely,
# split over four runners.
on:
  # Every pull request, also one that only changes docs: dev and main require these checks, and a
  # check that never runs would block the merge (ADR 0025). For docs alone they are skipped,
  # which counts as passed; the Website workflow checks the docs.
  pull_request:
  push:
    tags: ["v*.*.*-rc.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What the change touches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        # Only a pull request that provably touches nothing but docs skips the checks; any
        # doubt (a tag, a failed diff) runs them.
        run: |
          code=true
          # A pull request is checked out as its merge into the base: HEAD^1 is the base.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && files="$(git diff --name-only HEAD^1 HEAD)"; then
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Evq '^(website/|docs/)|\.md$'; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  backend-checks:
    name: Backend checks (lint, types, architecture, tests, audit)
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: cd backend && uv sync --frozen
      - run: make backend-lint backend-types backend-arch
      # testcontainers starts PostgreSQL through the runner's Docker daemon.
      - run: make backend-test
      - run: make backend-audit

  backend-mutation:
    name: Backend mutation (${{ github.event_name == 'pull_request' && 'changed modules' || 'all' }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: cd backend && uv sync --frozen
      - run: make backend-mutation CHANGED="$CHANGED"
        env:
          CHANGED: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

  # The name dev and main require; it passes when both backend jobs passed.
  backend:
    name: Backend (lint, types, architecture, tests, mutation, audit)
    needs: [changes, backend-checks, backend-mutation]
    if: always() && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          test "$CHECKS" = success
          test "$MUTATION" = success
        env:
          CHECKS: ${{ needs.backend-checks.result }}
          MUTATION: ${{ needs.backend-mutation.result }}

  frontend:
    name: Frontend (format, lint, types, layers, unit tests, audit, build)
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: make frontend-qa

  api-contract:
    name: Generated API client is up to date
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd backend && uv sync --frozen
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: make api-check

  e2e-part:
    name: E2E part ${{ matrix.part }}/4
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: make e2e SHARD="$PART/4"
        env:
          CI: "true"
          PART: ${{ matrix.part }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.part }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

  # The name dev and main require; it passes when every part passed.
  e2e:
    name: E2E (Playwright, axe-core, visual regression)
    needs: [changes, e2e-part]
    if: always() && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "$PARTS" = success
        env:
          PARTS: ${{ needs.e2e-part.result }}

  backup:
    name: Backup and restore (shellcheck, restic, pg_dump)
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: make backup-qa

  einvoice:
    name: E-invoices (KoSIT, Mustang, PDF/A-3)
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: cd backend && uv sync --frozen
      - run: make einvoice-qa

  # Every run, also for docs: a secret can hide anywhere (ADR 0033).
  security:
    name: Workflows and secrets (zizmor, gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # gitleaks reads every commit; the whole history takes seconds.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - run: make security
        env:
          # zizmor's online checks: impostor commits, known vulnerable actions.
          GH_TOKEN: ${{ github.token }}

  docker:
    name: Docker image builds
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: backup/Dockerfile
          push: false
