name: Desktop

# The installation without Docker (ADR 0021, 0022): builds the Windows setup and the macOS
# app with their app packages, checks them like a user would (on Windows the full smoke test,
# desktop/smoke_test.py) and keeps them as downloads of the run. The Release workflow calls
# it for every release candidate, with the candidate's version, and attaches the files to the
# pre-release. A pull request builds them only when it changes what the programs consist of
# beyond the web application, which CI checks anyway (ADR 0029); "Run workflow" builds them
# for any branch. Every run also builds Rhinvoice Beta (ADR 0030), the candidates' separate
# installation, from the same runtime and app package, and checks that it lives beside Rhinvoice
# without touching it. The candidate offers both; the promotion releases only Rhinvoice's.
on:
  workflow_call:
    inputs:
      version:
        description: "The version the programs carry (from the candidate's tag)"
        type: string
        default: ""
      candidate:
        description: "The candidate the app packages are built as (3 for v0.8.4-rc.3, ADR 0035)"
        type: string
        default: ""
  pull_request:
    paths:
      - "desktop/**"
      - "backend/src/rhinvoice/desktop/**"
      - "backend/src/rhinvoice_boot/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows setup (build, install, smoke test)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Give the program the candidate's version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python desktop/set_version.py "$env:VERSION"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the web interface
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/downloads
          key: desktop-downloads-${{ hashFiles('desktop/sources.json') }}

      - name: Assemble the program folder
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if ($env:CANDIDATE) { python desktop/build.py windows --candidate "$env:CANDIDATE" } else { python desktop/build.py windows }

      - name: Build the setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          $version = python desktop/build.py version
          & $iscc "/DAppVersion=$version" desktop\windows\rhinvoice.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # What makes the program big, for the next steps (sizes in MB).
          Get-ChildItem build\windows\install -Directory | ForEach-Object {
            $bytes = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum
            [pscustomobject]@{ Part = $_.Name; MB = [math]::Round($bytes / 1MB, 1) }
          } | Sort-Object MB -Descending | Format-Table -AutoSize
          Get-ChildItem build\windows\Rhinvoice-Setup-*.exe, build\windows\rhinvoice-app-*.zip |
            Format-Table Name, @{ Label = "MB"; Expression = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Build the Rhinvoice Beta setup (ADR 0030)
        shell: pwsh
        run: |
          # The same program folder with another name and edition; its own AppId and folders.
          python desktop/build.py windows-beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = python desktop/build.py version
          & $iscc "/DAppVersion=$version" "/DEdition=beta" desktop\windows\rhinvoice.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build\windows\Rhinvoice-Beta-Setup-*.exe |
            Format-Table Name, @{ Label = "MB"; Expression = { [math]::Round($_.Length / 1MB, 1) } }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Rhinvoice-Setup-windows
          path: |
            build/windows/Rhinvoice-Setup-*.exe
            build/windows/Rhinvoice-Beta-Setup-*.exe
            build/windows/rhinvoice-app-*.zip
          retention-days: 14

      - name: Install it silently for this user
        shell: pwsh
        run: |
          $setup = Get-ChildItem build\windows\Rhinvoice-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Rhinvoice\python\Rhinvoice.exe")) {
            throw "Rhinvoice was not installed"
          }

      - name: Smoke test the installed program
        shell: pwsh
        run: python desktop/smoke_test.py "$env:LOCALAPPDATA\Programs\Rhinvoice"

      - name: Install Rhinvoice Beta beside it
        shell: pwsh
        run: |
          $setup = Get-ChildItem build\windows\Rhinvoice-Beta-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Rhinvoice Beta\python\Rhinvoice.exe")) {
            throw "Rhinvoice Beta was not installed"
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Rhinvoice\python\Rhinvoice.exe")) {
            throw "Rhinvoice Beta replaced Rhinvoice"
          }
          # Two programs under "Installed apps", each with its own uninstall entry.
          $entries = @(Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Get-ItemProperty | Where-Object { $_.DisplayName -like "Rhinvoice*" })
          $entries | Format-Table DisplayName, DisplayVersion, InstallLocation -AutoSize
          $names = ($entries.DisplayName | Sort-Object) -join ", "
          if ($names -ne "Rhinvoice, Rhinvoice Beta") { throw "uninstall entries: $names" }

      - name: Smoke test Rhinvoice Beta (its own data; Rhinvoice's stays as it is)
        shell: pwsh
        run: python desktop/smoke_test.py "$env:LOCALAPPDATA\Programs\Rhinvoice Beta"

  macos:
    name: macOS app (build, start, disk image)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Give the program the candidate's version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python3 desktop/set_version.py "$VERSION"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the web interface
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/downloads
          key: desktop-downloads-macos-${{ hashFiles('desktop/sources.json') }}

      - name: Assemble Rhinvoice.app
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: python desktop/build.py macos ${CANDIDATE:+--candidate "$CANDIDATE"}

      - name: Derive Rhinvoice Beta.app (ADR 0030)
        # Before the first start: the copy must not take anything a start leaves behind.
        run: python desktop/build.py macos-beta

      - name: Start each app once (it must answer, on its own data)
        run: |
          for name in "Rhinvoice" "Rhinvoice Beta"; do
            echo "--- $name"
            app="build/macos/$name.app/Contents/MacOS/Rhinvoice"
            # Without a terminal the app logs to ~/Library/Logs/<name> (as from the Finder).
            "$app" --no-browser < /dev/null > /dev/null 2>&1 &
            log="$HOME/Library/Logs/$name/rhinvoice.log"
            config="$HOME/Library/Application Support/$name/rhinvoice.json"
            port=""
            for _ in $(seq 1 120); do
              if [ -f "$config" ]; then
                port="$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['port'])" "$config")"
                curl -fsS "http://127.0.0.1:$port/api/health" && break
              fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/api/health" || { cat "$log"; exit 1; }
            pkill -INT -f "MacOS/python3 -P -m rhinvoice_boot"
            sleep 5
            if pgrep -f "$name/database" >/dev/null; then
              echo "the database still runs after the program ended" >&2
              cat "$log"
              exit 1
            fi
            [ -d "$HOME/Library/Caches/$name/pycache" ] || { echo "no cache of $name" >&2; exit 1; }
            # Rhinvoice Beta starts after Rhinvoice: Rhinvoice's data must stay as it was.
            if [ "$name" = "Rhinvoice" ]; then
              before="$(shasum "$config")"
            elif [ "$(shasum "$HOME/Library/Application Support/Rhinvoice/rhinvoice.json")" != "$before" ]; then
              echo "::error title=Editions::Rhinvoice Beta changed the data of Rhinvoice"
              exit 1
            fi
          done

      - name: The starts left the signed apps unchanged
        run: |
          for app in "build/macos/Rhinvoice.app" "build/macos/Rhinvoice Beta.app"; do
            # Compiled Python files go to ~/Library/Caches/<name>, never into the bundle.
            found="$(find "$app" -name __pycache__)"
            if [ -n "$found" ]; then
              echo "::error title=Seal::compiled files inside the app: $found"
              exit 1
            fi
            codesign --verify --deep --strict "$app"
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "build/macos/Rhinvoice Beta.app/Contents/Info.plist" |
            grep -qx "ch.webberz.rhinvoice.beta"

      - name: Pack the disk images
        run: |
          version="$(python desktop/build.py version)"
          for name in "Rhinvoice" "Rhinvoice Beta"; do
            staging="$(mktemp -d)"
            cp -R "build/macos/$name.app" "$staging/"
            ln -s /Applications "$staging/Applications"
            image="build/macos/${name// /-}-$version.dmg"
            # ULMO (LZMA) packs far tighter than the usual UDZO (zlib); macOS opens it from
            # 10.15 on, below the app's minimum of 12.
            # hdiutil on the hosted runners fails now and then with "Resource busy" (a scan of
            # the fresh files still holds them): try again a few times before giving up.
            for attempt in 1 2 3 4 5; do
              hdiutil create -volname "$name $version" -srcfolder "$staging" -format ULMO \
                -ov "$image" && break
              [ "$attempt" = 5 ] && exit 1
              echo "hdiutil failed (attempt $attempt), trying again"
              sleep 10
            done
            hdiutil verify "$image"
            ls -l "$image"
          done
          # What makes the app big, for the next steps (sizes in MB).
          du -sm build/macos/Rhinvoice.app/Contents/Resources/* | sort -rn | head -8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Rhinvoice-macos
          path: |
            build/macos/Rhinvoice-*.dmg
            build/macos/rhinvoice-app-*.zip
          retention-days: 14

