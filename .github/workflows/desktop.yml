name: Desktop

# The installation without Docker (ADR 0021, 0022): builds the Windows setup and the macOS
# app with their app packages, checks them like a user would (on Windows the full smoke test,
# desktop/smoke_test.py) and keeps them as downloads of the run. The Release workflow calls
# it for every release candidate, with the candidate's version, and attaches the files to the
# pre-release. A pull request builds them only when it changes what the programs consist of
# beyond the web application, which CI checks anyway (ADR 0029); "Run workflow" builds them
# for any branch. Every run also builds Rhinvoice Beta (ADR 0030), the candidates' separate
# installation, from the same runtime and app package, and checks that it lives beside Rhinvoice
# without touching it. The candidate offers both; the promotion releases only Rhinvoice's.
# A candidate's programs are signed (ADR 0036): the macOS apps with the Developer ID and
# notarized by Apple, the Windows setups with Azure Artifact Signing, each in a job of its own
# that holds the certificate (or the federated login) and builds nothing. Then the signed files
# go through the smoke test as a user gets them. "Run workflow" signs on request.
on:
  workflow_call:
    inputs:
      version:
        description: "The version the programs carry (from the candidate's tag)"
        type: string
        default: ""
      candidate:
        description: "The candidate the app packages are built as (3 for v0.8.4-rc.3, ADR 0035)"
        type: string
        default: ""
  pull_request:
    paths:
      - "desktop/**"
      - "backend/src/rhinvoice/desktop/**"
      - "backend/src/rhinvoice_boot/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign and notarize the macOS apps (the branch must be admitted by the environment desktop-signing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows setup (build, install, smoke test)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Give the program the candidate's version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python desktop/set_version.py "$env:VERSION"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the web interface
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/downloads
          key: desktop-downloads-${{ hashFiles('desktop/sources.json') }}

      - name: Assemble the program folder
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if ($env:CANDIDATE) { python desktop/build.py windows --candidate "$env:CANDIDATE" } else { python desktop/build.py windows }

      - name: Build the setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          $version = python desktop/build.py version
          & $iscc "/DAppVersion=$version" desktop\windows\rhinvoice.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # What makes the program big, for the next steps (sizes in MB).
          Get-ChildItem build\windows\install -Directory | ForEach-Object {
            $bytes = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum
            [pscustomobject]@{ Part = $_.Name; MB = [math]::Round($bytes / 1MB, 1) }
          } | Sort-Object MB -Descending | Format-Table -AutoSize
          Get-ChildItem build\windows\Rhinvoice-Setup-*.exe, build\windows\rhinvoice-app-*.zip |
            Format-Table Name, @{ Label = "MB"; Expression = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Build the Rhinvoice Beta setup (ADR 0030)
        shell: pwsh
        run: |
          # The same program folder with another name and edition; its own AppId and folders.
          python desktop/build.py windows-beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = python desktop/build.py version
          & $iscc "/DAppVersion=$version" "/DEdition=beta" desktop\windows\rhinvoice.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build\windows\Rhinvoice-Beta-Setup-*.exe |
            Format-Table Name, @{ Label = "MB"; Expression = { [math]::Round($_.Length / 1MB, 1) } }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Signed, the setups come from the job windows-signing; these stay with the run.
          name: ${{ (inputs.version != '' || inputs.sign) && 'unsigned-windows' || 'Rhinvoice-Setup-windows' }}
          path: |
            build/windows/Rhinvoice-Setup-*.exe
            build/windows/Rhinvoice-Beta-Setup-*.exe
            build/windows/rhinvoice-app-*.zip
          retention-days: 14

      - name: Install it silently for this user
        shell: pwsh
        run: |
          $setup = Get-ChildItem build\windows\Rhinvoice-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Rhinvoice\python\Rhinvoice.exe")) {
            throw "Rhinvoice was not installed"
          }

      - name: Smoke test the installed program
        shell: pwsh
        run: python desktop/smoke_test.py "$env:LOCALAPPDATA\Programs\Rhinvoice"

      - name: Install Rhinvoice Beta beside it
        shell: pwsh
        run: |
          $setup = Get-ChildItem build\windows\Rhinvoice-Beta-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Rhinvoice Beta\python\Rhinvoice.exe")) {
            throw "Rhinvoice Beta was not installed"
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Rhinvoice\python\Rhinvoice.exe")) {
            throw "Rhinvoice Beta replaced Rhinvoice"
          }
          # Two programs under "Installed apps", each with its own uninstall entry.
          $entries = @(Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Get-ItemProperty | Where-Object { $_.DisplayName -like "Rhinvoice*" })
          $entries | Format-Table DisplayName, DisplayVersion, InstallLocation -AutoSize
          $names = ($entries.DisplayName | Sort-Object) -join ", "
          if ($names -ne "Rhinvoice, Rhinvoice Beta") { throw "uninstall entries: $names" }

      - name: Smoke test Rhinvoice Beta (its own data; Rhinvoice's stays as it is)
        shell: pwsh
        run: python desktop/smoke_test.py "$env:LOCALAPPDATA\Programs\Rhinvoice Beta"

  windows-signing:
    name: Windows setups (sign with Azure Artifact Signing)
    needs: windows
    if: inputs.version != '' || inputs.sign
    runs-on: windows-2025
    timeout-minutes: 30
    # Signs through the federated credential of this environment, without a client secret
    # (ADR 0036). Nothing is built or cached here.
    environment: desktop-signing
    permissions:
      contents: read
      # The token azure/login exchanges for Azure's.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-windows
          path: build/windows
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: build/windows
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
      - name: Both setups carry a valid signature
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem build\windows\*.exe)
          if ($setups.Count -ne 2) { throw "expected two setups, found $($setups.Count)" }
          foreach ($setup in $setups) {
            $signature = Get-AuthenticodeSignature $setup.FullName
            "{0}: {1}, {2}" -f $setup.Name, $signature.Status, $signature.SignerCertificate.Subject
            if ($signature.Status -ne "Valid") { throw "$($setup.Name) is not validly signed" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Rhinvoice-Setup-windows
          path: |
            build/windows/Rhinvoice-Setup-*.exe
            build/windows/Rhinvoice-Beta-Setup-*.exe
            build/windows/rhinvoice-app-*.zip
          retention-days: 14

  windows-signed:
    name: Windows setups as users get them (signature, install, smoke test)
    needs: windows-signing
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Rhinvoice-Setup-windows
          path: build/release
      - name: Install both signed setups silently for this user
        shell: pwsh
        run: |
          foreach ($pattern in "Rhinvoice-Setup-*.exe", "Rhinvoice-Beta-Setup-*.exe") {
            $setup = Get-ChildItem "build\release\$pattern" | Select-Object -First 1
            $signature = Get-AuthenticodeSignature $setup.FullName
            "{0}: {1}, {2}" -f $setup.Name, $signature.Status, $signature.SignerCertificate.Subject
            if ($signature.Status -ne "Valid") { throw "$($setup.Name) is not validly signed" }
            Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          }
          foreach ($name in "Rhinvoice", "Rhinvoice Beta") {
            if (-not (Test-Path "$env:LOCALAPPDATA\Programs\$name\python\Rhinvoice.exe")) {
              throw "$name was not installed"
            }
          }
      - name: Smoke test Rhinvoice
        shell: pwsh
        run: python desktop/smoke_test.py "$env:LOCALAPPDATA\Programs\Rhinvoice"
      - name: Smoke test Rhinvoice Beta beside it
        shell: pwsh
        run: python desktop/smoke_test.py "$env:LOCALAPPDATA\Programs\Rhinvoice Beta"

  macos:
    name: macOS app (build, start, disk image)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Give the program the candidate's version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python3 desktop/set_version.py "$VERSION"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the web interface
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/downloads
          key: desktop-downloads-macos-${{ hashFiles('desktop/sources.json') }}

      - name: Assemble Rhinvoice.app
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: python desktop/build.py macos ${CANDIDATE:+--candidate "$CANDIDATE"}

      - name: Derive Rhinvoice Beta.app (ADR 0030)
        # Before the first start: the copy must not take anything a start leaves behind.
        run: python desktop/build.py macos-beta

      - name: Start each app once (it must answer, on its own data)
        run: |
          for name in "Rhinvoice" "Rhinvoice Beta"; do
            echo "--- $name"
            app="build/macos/$name.app/Contents/MacOS/Rhinvoice"
            # Without a terminal the app logs to ~/Library/Logs/<name> (as from the Finder).
            "$app" --no-browser < /dev/null > /dev/null 2>&1 &
            log="$HOME/Library/Logs/$name/rhinvoice.log"
            config="$HOME/Library/Application Support/$name/rhinvoice.json"
            port=""
            for _ in $(seq 1 120); do
              if [ -f "$config" ]; then
                port="$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['port'])" "$config")"
                curl -fsS "http://127.0.0.1:$port/api/health" && break
              fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/api/health" || { cat "$log"; exit 1; }
            pkill -INT -f "MacOS/$name Helper -P -m rhinvoice_boot"
            sleep 5
            if pgrep -f "$name/database" >/dev/null; then
              echo "the database still runs after the program ended" >&2
              cat "$log"
              exit 1
            fi
            [ -d "$HOME/Library/Caches/$name/pycache" ] || { echo "no cache of $name" >&2; exit 1; }
            # Rhinvoice Beta starts after Rhinvoice: Rhinvoice's data must stay as it was.
            if [ "$name" = "Rhinvoice" ]; then
              before="$(shasum "$config")"
            elif [ "$(shasum "$HOME/Library/Application Support/Rhinvoice/rhinvoice.json")" != "$before" ]; then
              echo "::error title=Editions::Rhinvoice Beta changed the data of Rhinvoice"
              exit 1
            fi
          done

      - name: The starts left the signed apps unchanged
        run: |
          for app in "build/macos/Rhinvoice.app" "build/macos/Rhinvoice Beta.app"; do
            # Compiled Python files go to ~/Library/Caches/<name>, never into the bundle.
            found="$(find "$app" -name __pycache__)"
            if [ -n "$found" ]; then
              echo "::error title=Seal::compiled files inside the app: $found"
              exit 1
            fi
            codesign --verify --deep --strict "$app"
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "build/macos/Rhinvoice Beta.app/Contents/Info.plist" |
            grep -qx "ch.webberz.rhinvoice.beta"

      - name: Pack the disk images
        run: |
          for name in "Rhinvoice" "Rhinvoice Beta"; do
            python desktop/macos.py dmg "build/macos/$name.app" build/macos
          done
          # What makes the app big, for the next steps (sizes in MB).
          du -sm build/macos/Rhinvoice.app/Contents/Resources/* | sort -rn | head -8

      # Signed, the disk images come from the job macos-signing; these stay with the run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ (inputs.version != '' || inputs.sign) && 'unsigned-macos' || 'Rhinvoice-macos' }}
          path: |
            build/macos/Rhinvoice-*.dmg
            build/macos/rhinvoice-app-*.zip
          retention-days: 14
      - name: Keep the apps for signing (tar keeps file modes, links and attributes)
        if: inputs.version != '' || inputs.sign
        run: tar -cf build/macos/apps.tar -C build/macos "Rhinvoice.app" "Rhinvoice Beta.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.version != '' || inputs.sign
        with:
          name: macos-apps
          path: |
            build/macos/apps.tar
            build/macos/rhinvoice-app-*.zip
          retention-days: 1

  macos-signing:
    name: macOS apps (sign with the Developer ID, notarize)
    needs: macos
    if: inputs.version != '' || inputs.sign
    runs-on: macos-15
    timeout-minutes: 90
    # Holds the Developer ID certificate: admits only v* tags, and the branch that tests this
    # job while it is built (ADR 0036). Nothing is built or cached here; Apple's tools and
    # desktop/macos.py (standard library only, the system's Python) are all that runs.
    environment: desktop-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-apps
          path: build/macos
      - name: Unpack the apps
        run: tar -xf build/macos/apps.tar -C build/macos && rm build/macos/apps.tar

      - name: Put the certificate into a keychain of this run
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::The secret APPLE_CERTIFICATE of the environment desktop-signing is missing."
            exit 1
          fi
          # The decoded certificate never outlives this step, also when the import fails.
          trap 'rm -f "$RUNNER_TEMP/certificate.p12"' EXIT
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain"

      - name: Sign the apps
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
        run: /usr/bin/python3 desktop/macos.py sign "build/macos/Rhinvoice.app" "build/macos/Rhinvoice Beta.app"
      - name: Notarize the apps
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in "Rhinvoice" "Rhinvoice Beta"; do
            /usr/bin/python3 desktop/macos.py notarize "build/macos/$name.app"
          done
      - name: Pack and sign the disk images
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
        run: |
          for name in "Rhinvoice" "Rhinvoice Beta"; do
            /usr/bin/python3 desktop/macos.py dmg "build/macos/$name.app" build/macos
          done
          /usr/bin/python3 desktop/macos.py sign build/macos/Rhinvoice-*.dmg
      - name: Notarize the disk images
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for image in build/macos/Rhinvoice-*.dmg; do
            /usr/bin/python3 desktop/macos.py notarize "$image"
          done
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Rhinvoice-macos
          path: |
            build/macos/Rhinvoice-*.dmg
            build/macos/rhinvoice-app-*.zip
          retention-days: 14

  macos-signed:
    name: macOS apps as users get them (Gatekeeper, smoke test)
    needs: macos-signing
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Rhinvoice-macos
          path: build/release

      - name: Install the apps from the disk images, as a user does
        run: |
          # Apple's ticket service drops a connection now and then: ask again before failing.
          validate() {
            for attempt in 1 2 3 4 5; do
              xcrun stapler validate "$1" && return 0
              echo "stapler validate failed (attempt $attempt), trying again"
              sleep 30
            done
            return 1
          }
          for name in "Rhinvoice" "Rhinvoice Beta"; do
            # A digit after the name: "Rhinvoice-*" would also take Rhinvoice Beta's image.
            image="$(ls build/release/"${name// /-}"-[0-9]*.dmg)"
            echo "--- $image"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$image"
            validate "$image"
            mount="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$image"
            ditto "$mount/$name.app" "/Applications/$name.app"
            hdiutil detach "$mount"
          done

      - name: Gatekeeper lets them start (signed by the Developer ID, notarized)
        run: |
          # Apple's ticket service drops a connection now and then: ask again before failing.
          validate() {
            for attempt in 1 2 3 4 5; do
              xcrun stapler validate "$1" && return 0
              echo "stapler validate failed (attempt $attempt), trying again"
              sleep 30
            done
            return 1
          }
          for name in "Rhinvoice" "Rhinvoice Beta"; do
            app="/Applications/$name.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            validate "$app"
            verdict="$(spctl --assess --type execute --verbose=2 "$app" 2>&1)"
            echo "$verdict"
            echo "$verdict" | grep -q "source=Notarized Developer ID" || {
              echo "::error title=Gatekeeper::$name.app is not accepted as notarized: $verdict"
              exit 1
            }
          done

      # Updates come as the release's app package, whose modules the certificate did not sign:
      # the hardened runtime must load them (desktop/entitlements.plist).
      - name: Smoke test Rhinvoice
        run: |
          python desktop/smoke_test.py "/Applications/Rhinvoice.app/Contents/Resources" \
