name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build rhinvoice.com
    # Only the public repository publishes the site.
    if: github.repository == 'rhinvoice/rhinvoice'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global terser
      - run: python3 website/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
          # .well-known/security.txt and .nojekyll are dotfiles.
          include-hidden-files: true

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
