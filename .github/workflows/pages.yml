name: Website

# The docs read CHANGELOG.md for their release notes. Only main is published: it holds what was
# released (ADR 0026). Pull requests are checked, not published.
on:
  push:
    branches: [main]
    paths: ["website/**", "docs/screenshots/**", "CHANGELOG.md", "Makefile", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["website/**", "docs/screenshots/**", "CHANGELOG.md", "Makefile", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Only the deploy job may publish (ADR 0033).
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rhinvoice.com
    # Only the public repository publishes the site.
    if: github.repository == 'rhinvoice/rhinvoice'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The docs show when each page last changed, from the git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: website/docs/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/docs/pnpm-lock.yaml
      - run: npm install --global --ignore-scripts terser@5.51.2
      # Puts version and file sizes of the newest release next to the download buttons.
      - run: python3 website/build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The docs go into website/dist/docs, next to the landing page: types, writing rules,
      # build, links and audit in one go.
      - run: pnpm install --frozen-lockfile
        working-directory: website/docs
      - run: make docs-qa
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/dist
          # .well-known/security.txt and .nojekyll are dotfiles.
          include-hidden-files: true

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      # Publishes the site; GitHub Pages checks the job's OIDC token.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5