name: Website

# The docs read CHANGELOG.md for their release notes. Pull requests are checked, not published.
on:
  push:
    branches: [main]
    paths: ["website/**", "docs/screenshots/**", "CHANGELOG.md", "Makefile", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["website/**", "docs/screenshots/**", "CHANGELOG.md", "Makefile", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rhinvoice.com
    # Only the public repository publishes the site.
    if: github.repository == 'rhinvoice/rhinvoice'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The docs show when each page last changed, from the git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/docs/pnpm-lock.yaml
      - run: npm install --global terser
      - run: python3 website/build.py
      # The docs go into website/dist/docs, next to the landing page: types, writing rules,
      # build, links and audit in one go.
      - run: pnpm install --frozen-lockfile
        working-directory: website/docs
      - run: make docs-qa
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
          # .well-known/security.txt and .nojekyll are dotfiles.
          include-hidden-files: true

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
