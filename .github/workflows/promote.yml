name: Promote release

# Releases a tested candidate (ADR 0025): v0.7.4-rc.2 becomes v0.7.4 with exactly its files,
# nothing is built again. The setups, the app packages and the Docker images are the ones
# that were tested; only release.json is written anew, so that its links lead to the
# release, and signed with the same key. Rhinvoice Beta's setups stay with the candidate
# (ADR 0030). Then the released commit goes to main (ADR 0026),
# and rhinvoice.com and the demos follow.
#
# Started by the maintainer: Actions → Promote release → Run workflow. Without a candidate it
# takes the newest one that is not released yet (ADR 0029).

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "The tested candidate, e.g. v0.7.4-rc.2; empty: the newest candidate"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Release ${{ inputs.candidate || 'the newest candidate' }}
    if: github.repository == 'rhinvoice/rhinvoice'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      # Starts the website build and the demo deployment.
      actions: write
      # Brings the released commit to main.
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Choose the candidate
        id: candidate
        env:
          CANDIDATE: ${{ inputs.candidate }}
        # Checked before the checkout, so a typo gets a clear message.
        run: |
          rc='^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')"
          if [ -z "$CANDIDATE" ]; then
            # Newest first: the first candidate whose version has no release yet.
            for tag in $releases; do
              printf '%s' "$tag" | grep -Eq "$rc" || continue
              printf '%s\n' "$releases" | grep -qx "${tag%-rc.*}" && continue
              CANDIDATE="$tag"
              break
            done
            if [ -z "$CANDIDATE" ]; then
              echo "::error::There is no candidate waiting for its release"
              exit 1
            fi
          fi
          if ! printf '%s' "$CANDIDATE" | grep -Eq "$rc"; then
            echo "::error::Name a candidate like v0.7.4-rc.2, not '$CANDIDATE'"
            exit 1
          fi
          if ! printf '%s\n' "$releases" | grep -qx "$CANDIDATE"; then
            echo "::error::There is no candidate $CANDIDATE; the newest ones: $(printf '%s\n' "$releases" | grep -E "$rc" | head -3 | tr '\n' ' ')"
            exit 1
          fi
          if ! gh release view "$CANDIDATE" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' | grep -q true; then
            echo "::error::$CANDIDATE is no pre-release of the Release workflow"
            exit 1
          fi
          version="${CANDIDATE#v}"
          version="${version%-rc.*}"
          if printf '%s\n' "$releases" | grep -qx "v$version"; then
            echo "::error::v$version is released already"
            exit 1
          fi
          echo "Candidate: $CANDIDATE" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "name=$CANDIDATE"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # The candidate's own changelog and history.
          ref: ${{ steps.candidate.outputs.name }}
          fetch-depth: 0

      - name: The candidate's commit
        id: version
        env:
          CANDIDATE: ${{ steps.candidate.outputs.name }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          {
            echo "version=$VERSION"
            echo "commit=$(git rev-list -n 1 "$CANDIDATE")"
          } >> "$GITHUB_OUTPUT"

      # This token may not create a tag or branch at a commit whose workflows differ from the
      # default branch's. That happens when dev changed its workflows after the candidate; the
      # maintainer then creates both refs once, before anything is published.
      - name: The release's tag and branch can be created
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          git fetch -q --depth 1 origin dev
          git diff --quiet "$COMMIT" FETCH_HEAD -- .github/workflows && exit 0
          missing=""
          git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null \
            || missing="$missing $COMMIT:refs/tags/v$VERSION"
          git ls-remote --exit-code origin "refs/heads/release/v$VERSION" >/dev/null \
            || missing="$missing $COMMIT:refs/heads/release/v$VERSION"
          [ -z "$missing" ] && exit 0
          echo "::error::dev changed its workflows since the candidate, so this workflow may not create v$VERSION. Run once, then run Promote again: git push origin$missing"
          exit 1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Take the candidate's files
        env:
          CANDIDATE: ${{ steps.candidate.outputs.name }}
        run: |
          mkdir -p build/release
          # Rhinvoice's setups only: Rhinvoice Beta's are for testing the candidate (ADR 0030).
          gh release download "$CANDIDATE" --dir build/release \
            --pattern 'Rhinvoice-Setup-Windows.exe' --pattern 'Rhinvoice-macOS.dmg' \
            --pattern 'rhinvoice-app-*'
          if compgen -G 'build/release/*Beta*' > /dev/null; then
            echo "::error::A file of Rhinvoice Beta would be released"
            exit 1
          fi
          ls -l build/release

      - name: Write and sign release.json for the release (ADR 0022)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The secret RELEASE_SIGNING_KEY is missing: without a signed release.json no installation learns of this release."
            exit 1
          fi
          uv run --project backend python desktop/release_manifest.py "$VERSION" build/release

      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PY' > build/notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if match is None:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          print(match.group(1).strip())
          PY

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the candidate's images as the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CANDIDATE: ${{ steps.candidate.outputs.name }}
        run: |
          minor="${VERSION%.*}"
          for repository in rhinvoice rhinvoice-backup; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/$repository"
            docker buildx imagetools create \
              -t "$image:$VERSION" -t "$image:$minor" -t "$image:latest" \
              "$image:${CANDIDATE#v}"
          done

      - name: Create the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          gh release create "v$VERSION" --target "$COMMIT" --latest \
            --title "Rhinvoice $VERSION" --notes-file build/notes.md build/release/*

      - name: Deploy the demos
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # A release made with this token starts no workflow by itself.
        run: gh workflow run demo.yml --ref dev -f version="$VERSION"

      - name: Bring the release to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        # The released commit, not dev's newest one: dev may already hold the next changes. Its
        # checks passed in the candidate's full CI run, so the pull request can merge at once.
        # Merged with this token, main starts no workflow by itself: the website is started here.
        # Should the merge not work (for instance without "Allow GitHub Actions to create and
        # approve pull requests"), the summary links the pull request to merge by hand.
        run: |
          branch="release/v$VERSION"
          git push origin "$COMMIT:refs/heads/$branch"
          url="https://github.com/${GITHUB_REPOSITORY}/compare/main...$branch?expand=1"
          if gh pr create --base main --head "$branch" --title "Release $VERSION" \
              --body "The released commit of v$VERSION (ADR 0026)." \
            && gh pr merge "$branch" --merge --delete-branch; then
            gh workflow run pages.yml --ref main
            echo "Released v$VERSION; main and rhinvoice.com follow." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Released v$VERSION. Main could not take it by itself; last step:"
              echo
              echo "[Merge the pull request into main]($url)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
