name: Promote release

# Releases a tested candidate (ADR 0025): v0.7.4-rc.2 becomes v0.7.4 with exactly its files,
# nothing is built again. The setups, the app packages and the Docker images are the ones
# that were tested; only release.json is written anew, so that its links lead to the
# release, and signed with the same key. Then rhinvoice.com and the demos follow.
#
# Started by the maintainer: Actions → Promote release → Run workflow, with the candidate.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "The tested candidate, e.g. v0.7.4-rc.2"
        required: true

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Release ${{ inputs.candidate }}
    if: github.repository == 'rhinvoice/rhinvoice'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      # Starts the website build and the demo deployment.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The candidate exists and is not released yet
        id: version
        run: |
          if ! printf '%s' "$CANDIDATE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "::error::Name a candidate like v0.7.4-rc.2, not '$CANDIDATE'"
            exit 1
          fi
          version="${CANDIDATE#v}"
          version="${version%-rc.*}"
          if ! gh release view "$CANDIDATE" --json isPrerelease --jq '.isPrerelease' | grep -q true; then
            echo "::error::$CANDIDATE is no pre-release of the Release workflow"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is released already"
            exit 1
          fi
          {
            echo "version=$version"
            echo "commit=$(git rev-list -n 1 "$CANDIDATE")"
          } >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Take the candidate's files
        run: |
          mkdir -p build/release
          gh release download "$CANDIDATE" --dir build/release \
            --pattern 'Rhinvoice-*' --pattern 'rhinvoice-app-*'
          ls -l build/release

      - name: Write and sign release.json for the release (ADR 0022)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The secret RELEASE_SIGNING_KEY is missing: without a signed release.json no installation learns of this release."
            exit 1
          fi
          uv run --project backend python desktop/release_manifest.py "$VERSION" build/release

      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PY' > build/notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if match is None:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          print(match.group(1).strip())
          PY

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the candidate's images as the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          minor="${VERSION%.*}"
          for repository in rhinvoice rhinvoice-backup; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/$repository"
            docker buildx imagetools create \
              -t "$image:$VERSION" -t "$image:$minor" -t "$image:latest" \
              "$image:${CANDIDATE#v}"
          done

      - name: Create the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          gh release create "v$VERSION" --target "$COMMIT" --latest \
            --title "Rhinvoice $VERSION" --notes-file build/notes.md build/release/*

      - name: Rebuild rhinvoice.com and deploy the demos
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # A release made with this token starts no workflow by itself.
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run demo.yml --ref main -f version="$VERSION"
