name: Release

# Builds a release candidate (ADR 0025, 0026, 0029): a tag vX.Y.Z-rc.N on dev becomes a public
# pre-release with the setups, the app packages, a signed release.json and Docker images tagged
# X.Y.Z-rc.N. Besides Rhinvoice's setups it carries Rhinvoice Beta's (ADR 0030): the candidate is
# tested as a separate installation, and only Rhinvoice's setups are promoted. The version comes from the tag; no commit changes it. The tag also starts the full
# CI run (every mutant, every browser test); the candidate is published only once it passed.
# Nobody gets it by itself: GitHub's "latest", the update check, rhinvoice.com and the demos
# stay on the last release. Once the candidate is tested, "Promote release" releases exactly
# these files as vX.Y.Z.

on:
  push:
    tags: ["v*.*.*-rc.*"]

# Each job is granted only what it needs (ADR 0033).
permissions:
  contents: read

jobs:
  candidate:
    name: Check the candidate's tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      candidate: ${{ steps.version.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        name: The tag names a version the changelog describes, on dev
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "::error::A candidate's tag looks like v0.7.4-rc.1, not $GITHUB_REF_NAME"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          version="${version%-rc.*}"
          # The release notes come from there (and the docs mark new features with it).
          if ! grep -Eq "^## \[${version//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$version]'; add it in the pull request"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is released already; a fix needs a new version"
            exit 1
          fi
          # Candidates come from dev; main only receives what was released (ADR 0026).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "::error::$GITHUB_REF_NAME is not on dev; tag a commit of dev"
            exit 1
          fi
          {
            echo "version=$version"
            echo "candidate=${GITHUB_REF_NAME##*-rc.}"
          } >> "$GITHUB_OUTPUT"

  image-build:
    name: Build ${{ matrix.image.name }} image (${{ matrix.platform }})
    needs: candidate
    # Each platform builds on a runner of its own kind. Emulating arm64 (QEMU) took long
    # and once hung for an hour.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # A build normally takes under ten minutes; a stuck one fails instead of running for hours.
    timeout-minutes: 30
    permissions:
      contents: read
      # Pushes the platform's image by digest.
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        image:
          - { name: app, repository: rhinvoice, file: Dockerfile }
          - { name: backup, repository: rhinvoice-backup, file: backup/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Give the program the candidate's version
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        run: python3 desktop/set_version.py "$VERSION"
      - name: Name the platform for files (linux/arm64 -> linux-arm64)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          platform="$PLATFORM"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
      # Pushed without a tag; the publish job below joins both platforms under the tags.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}
      - name: Keep the digest for the publish job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="$DIGEST"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  checks:
    name: Full CI run of the candidate
    # The tag starts CI with every mutant and every browser test (ci.yml); nothing is
    # published before it passed.
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Reads the CI run of the tagged commit.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for CI on the tagged commit
        run: |
          for _ in $(seq 1 30); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --json databaseId --jq '.[0].databaseId')"
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::No CI run for $GITHUB_REF_NAME"
            exit 1
          fi
          echo "CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null

  images:
    name: Publish ${{ matrix.image.name }} image to GHCR
    needs: [image-build, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Joins both platforms under the candidate's tag.
      packages: write
    strategy:
      matrix:
        image:
          - { name: app, repository: rhinvoice }
          - { name: backup, repository: rhinvoice-backup }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # The candidate's tag only (0.7.4-rc.1); 0.7.4, 0.7 and latest follow at the promotion.
          tags: type=semver,pattern={{version}}
      - name: Join both platforms under the candidate's tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Show the published image
        env:
          TAG: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$TAG"

  desktop:
    name: Desktop setups and app packages
    needs: candidate
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.candidate.outputs.version }}
      # The app packages name it; Rhinvoice Beta tells candidates of one version apart (ADR 0035).
      candidate: ${{ needs.candidate.outputs.candidate }}

  github-release:
    name: GitHub pre-release (setups, app packages, signed release.json)
    # The pre-release appears only when everything it announces exists: images and setups.
    needs: [candidate, checks, images, desktop]
    runs-on: ubuntu-24.04
    # Holds the signing key: runs only for a v* tag and after the maintainer's approval (ADR 0033).
    environment: release
    permissions:
      # Creates the pre-release with its files.
      contents: write
    env:
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No cache in a job that holds the signing key (ADR 0033).
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # Only the setups and app packages: the image builds leave records (*.dockerbuild)
          # that this action cannot extract.
          pattern: Rhinvoice-*
          path: build/release
          merge-multiple: true

      - name: Give the setups names without the version
        # releases/latest/download/<name> then always leads to the newest (rhinvoice.com).
        run: |
          mv "build/release/Rhinvoice-Setup-$VERSION.exe" build/release/Rhinvoice-Setup-Windows.exe
          mv "build/release/Rhinvoice-$VERSION.dmg" build/release/Rhinvoice-macOS.dmg
          mv "build/release/Rhinvoice-Beta-Setup-$VERSION.exe" build/release/Rhinvoice-Beta-Setup-Windows.exe
          mv "build/release/Rhinvoice-Beta-$VERSION.dmg" build/release/Rhinvoice-Beta-macOS.dmg

      # The key is in this step only, and only cryptography runs beside it: desktop/signing
      # holds nothing else, locked with hashes (ADR 0033).
      - name: Write and sign release.json (ADR 0022)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The secret RELEASE_SIGNING_KEY is missing: without a signed release.json no installation learns of this release."
            exit 1
          fi
          uv run --project desktop/signing --frozen python desktop/release_manifest.py \
            "$VERSION" build/release --tag "$GITHUB_REF_NAME"
          ls -l build/release

      - name: Release notes from the changelog
        run: |
          {
            echo "**Release candidate for testing.** Not offered as an update and not for production use; see [testing release candidates](https://rhinvoice.com/docs/operations/update/)."
            echo
            echo "To try it on Windows or a Mac, install **Rhinvoice Beta** (\`Rhinvoice-Beta-Setup-Windows.exe\`, \`Rhinvoice-Beta-macOS.dmg\`): a separate program with its own data, installed beside Rhinvoice, which it never touches. \`Rhinvoice-Setup-Windows.exe\` and \`Rhinvoice-macOS.dmg\` are the setups the release will carry; installed, they replace Rhinvoice."
            echo
          } > build/notes.md
          python3 - "$VERSION" <<'PY' >> build/notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if match is None:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          print(match.group(1).strip())
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate="${GITHUB_REF_NAME##*-rc.}"
          gh release create "$GITHUB_REF_NAME" --prerelease \
            --title "Rhinvoice $VERSION, release candidate $candidate" \
            --notes-file build/notes.md build/release/*
