name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image-build:
    name: Build ${{ matrix.image.name }} image (${{ matrix.platform }})
    # Each platform builds on a runner of its own kind. Emulating arm64 (QEMU) took long
    # and once hung for an hour.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # A build normally takes under ten minutes; a stuck one fails instead of running for hours.
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        image:
          - { name: app, repository: rhinvoice, file: Dockerfile }
          - { name: backup, repository: rhinvoice-backup, file: backup/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Name the platform for files (linux/arm64 -> linux-arm64)
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      # Pushed without a tag; the publish job below joins both platforms under the tags.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}
      - name: Keep the digest for the publish job
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  images:
    name: Publish ${{ matrix.image.name }} image to GHCR
    needs: image-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        image:
          - { name: app, repository: rhinvoice }
          - { name: backup, repository: rhinvoice-backup }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Join both platforms under the version tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Show the published image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  desktop:
    name: Desktop setups and app packages
    uses: ./.github/workflows/desktop.yml

  github-release:
    name: GitHub release (setups, app packages, signed release.json)
    # The release appears only when everything it announces exists: the images and the setups.
    needs: [images, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Starts the website build: the download buttons show the new version and sizes.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/download-artifact@v4
        with:
          # Only the setups and app packages: the image builds leave records (*.dockerbuild)
          # that this action cannot extract.
          pattern: Rhinvoice-*
          path: build/release
          merge-multiple: true

      - name: Give the setups names without the version
        # releases/latest/download/<name> then always leads to the newest (rhinvoice.com).
        run: |
          mv build/release/Rhinvoice-Setup-*.exe build/release/Rhinvoice-Setup-Windows.exe
          mv build/release/Rhinvoice-*.dmg build/release/Rhinvoice-macOS.dmg

      - name: Write and sign release.json (ADR 0022)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The secret RELEASE_SIGNING_KEY is missing: without a signed release.json no installation learns of this release."
            exit 1
          fi
          uv run --project backend python desktop/release_manifest.py "${GITHUB_REF_NAME#v}" build/release
          ls -l build/release

      - name: Release notes from the changelog
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'PY' > build/notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if match is None:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          print(match.group(1).strip())
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Rhinvoice ${GITHUB_REF_NAME#v}" \
            --notes-file build/notes.md build/release/*

      - name: Rebuild rhinvoice.com with the new sizes
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made with this token starts no workflow by itself.
        run: gh workflow run pages.yml --ref main
